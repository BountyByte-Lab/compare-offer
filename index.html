<script>
(function(){
'use strict';

var LS_KEY = 'jobcompare.v1';
var BRAND = 'Perbandingan Tawaran Kerja';
var CREATOR = 'YFA';
var OWNER_KEY = 'jobcompare_owner';
var ACCESS_KEY = 'jobcompare_access';
// Kode akses dikirim otomatis per pembeli via Cloudflare Worker + Brevo.
// Ganti SECRET di bawah dengan nilai yang SAMA persis seperti di worker.js
var SECRET = 'yva6TdOhu75CXQJYHwhH0ymwmyjxaG';

var ownerName = null;
var accessOk = false;
try {
  ownerName = localStorage.getItem(OWNER_KEY);
  accessOk = localStorage.getItem(ACCESS_KEY) === '1';
} catch (e) {}

var ICON_DOWNLOAD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M4 19h16"></path></svg>';
var ICON_SHARE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="10.51" x2="15.42" y2="6.51"></line><line x1="8.59" y1="13.49" x2="15.42" y2="17.49"></line></svg>';

function offerDisplayName(s, key) {
  var n = (s[key].nama || '').trim();
  if (n) return n;
  return key === 'offerA' ? 'Tawaran A' : 'Tawaran B';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

var defaultOffer = function(nama, gaji) {
  return {
    nama: nama, gajiPokok: gaji, tunjTransport: 0, tunjMakan: 0, tunjLain: 0,
    bonusType: 'tetap', bonusValue: 0, thrMultiplier: 1,
    catatanLain: '', useEsop: false, esopAmount: 0, esopJumlah: '', esopStrike: 0, esopVesting: '', esopLikuiditas: 'belum'
  };
};

var defaults = {
  tab: 0, showAsumsi: true,
  ptkpStatus: 'TK0', jkkRate: 0.54,
  offerA: defaultOffer('', 15000000),
  offerB: defaultOffer('', 16000000)
};

var state = JSON.parse(JSON.stringify(defaults));
try {
  var raw = localStorage.getItem(LS_KEY);
  if (raw) {
    var saved = JSON.parse(raw);
    state = Object.assign({}, defaults, saved);
    state.offerA = Object.assign({}, defaultOffer('', 15000000), saved.offerA || {});
    state.offerB = Object.assign({}, defaultOffer('', 16000000), saved.offerB || {});
  }
} catch (e) {}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
function getNested(obj, path) {
  var parts = path.split('.');
  var cur = obj;
  for (var i = 0; i < parts.length; i++) cur = cur[parts[i]];
  return cur;
}
function setNested(obj, path, value) {
  var parts = path.split('.');
  var cur = obj;
  for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = value;
}
function setState(patch) {
  Object.keys(patch).forEach(function(path){ setNested(state, path, patch[path]); });
  save();
  render();
}

// ---------- number formatting (manual, avoids toLocaleString ICU issues on some devices) ----------
function num(v, dec) {
  dec = dec || 0;
  var negative = v < 0;
  var fixed = Math.abs(v).toFixed(dec);
  var parts = fixed.split('.');
  var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  var out = (negative ? '-' : '') + intPart;
  if (dec > 0) out += ',' + parts[1];
  return out;
}
function rp(v) {
  if (!isFinite(v) || v === 0) return 'Rp 0';
  var neg = v < 0; v = Math.abs(v);
  var s = 'Rp ' + num(Math.round(v));
  return neg ? '-' + s : s;
}
function full(v) { return v > 0 ? num(Math.round(v)) : ''; }
function pct(v, dec) { return num(v, dec === undefined ? 1 : dec).replace(/,0$/, '') + '%'; }

// ---------- PPh 21 (Pasal 17 progresif, annual) ----------
var PTKP_TABLE = { TK0: 54000000, K0: 58500000, K1: 63000000, K2: 67500000, K3: 70000000 };
// Batas upah Jaminan Pensiun, sama untuk semua orang, ditetapkan BPJS Ketenagakerjaan.
// Berlaku sejak Maret 2026 (SE BPJS Ketenagakerjaan No. B/1226/022026), naik tiap tahun sekitar Februari/Maret.
// Update angka ini di sini kalau BPJS Ketenagakerjaan mengumumkan batas baru, cek bpjsketenagakerjaan.go.id
var JP_CAP = 11086300;
var PTKP_LABEL = { TK0: 'Lajang (TK/0)', K0: 'Kawin, tanpa tanggungan (K/0)', K1: 'Kawin, 1 tanggungan (K/1)', K2: 'Kawin, 2 tanggungan (K/2)', K3: 'Kawin, 3 tanggungan (K/3)' };

function progressiveTax(pkp) {
  var widths = [60000000, 190000000, 250000000, 4500000000, Infinity];
  var rates = [0.05, 0.15, 0.25, 0.30, 0.35];
  var remaining = Math.max(0, pkp);
  var tax = 0;
  for (var i = 0; i < widths.length && remaining > 0; i++) {
    var amt = Math.min(remaining, widths[i]);
    tax += amt * rates[i];
    remaining -= amt;
  }
  return tax;
}

// ---------- core calculation per offer ----------
function computeOffer(o, shared) {
  var monthlyFixed = o.gajiPokok + o.tunjTransport + o.tunjMakan + o.tunjLain;
  var annualFixed = monthlyFixed * 12;
  var thrAmt = o.thrMultiplier * monthlyFixed;
  var bonusAmt = (o.bonusType === 'persentase' || o.bonusType === 'kinerja')
    ? (o.bonusValue / 100) * annualFixed
    : (o.bonusType === 'tetap' ? o.bonusValue : 0);
  var grossAnnual = annualFixed + thrAmt + bonusAmt;

  var bpjsKesBase = Math.min(monthlyFixed, 12000000);
  var bpjsKesEmp = bpjsKesBase * 0.01, bpjsKesEmployer = bpjsKesBase * 0.04;
  var jhtEmp = monthlyFixed * 0.02, jhtEmployer = monthlyFixed * 0.037;
  var jpBase = Math.min(monthlyFixed, JP_CAP);
  var jpEmp = jpBase * 0.01, jpEmployer = jpBase * 0.02;
  var jkkEmployer = monthlyFixed * (shared.jkkRate / 100);
  var jkmEmployer = monthlyFixed * 0.003;

  var empBpjsMonthly = bpjsKesEmp + jhtEmp + jpEmp;
  var empBpjsAnnual = empBpjsMonthly * 12;
  var employerBenefitMonthly = bpjsKesEmployer + jhtEmployer + jpEmployer + jkkEmployer + jkmEmployer;
  var employerBenefitAnnual = employerBenefitMonthly * 12;

  var biayaJabatan = Math.min(grossAnnual * 0.05, 6000000);
  var pensionDeduct = (jhtEmp + jpEmp) * 12;
  var netAnnual = Math.max(0, grossAnnual - biayaJabatan - pensionDeduct);
  var ptkp = PTKP_TABLE[shared.ptkpStatus];
  var pkp = Math.max(0, netAnnual - ptkp);
  var pph21Annual = progressiveTax(pkp);

  var takeHomeAnnual = grossAnnual - empBpjsAnnual - pph21Annual;
  var takeHomeMonthlyAvg = takeHomeAnnual / 12;

  return {
    monthlyFixed: monthlyFixed, annualFixed: annualFixed, thrAmt: thrAmt, bonusAmt: bonusAmt,
    grossAnnual: grossAnnual, empBpjsAnnual: empBpjsAnnual, employerBenefitAnnual: employerBenefitAnnual,
    pph21Annual: pph21Annual, takeHomeAnnual: takeHomeAnnual, takeHomeMonthlyAvg: takeHomeMonthlyAvg, pkp: pkp
  };
}

function buildCallouts(s, cA, cB) {
  var items = [];
  var benefitDiff = cA.employerBenefitAnnual - cB.employerBenefitAnnual;
  if (Math.abs(benefitDiff) > 300000) {
    var higherName = benefitDiff > 0 ? offerDisplayName(s, 'offerA') : offerDisplayName(s, 'offerB');
    items.push(escapeHtml(higherName) + ' menanggung BPJS lebih besar dari sisi perusahaan, sekitar ' + rp(Math.abs(benefitDiff)) + ' per tahun. Ini nilai riil yang tidak masuk ke take-home, tapi tetap manfaat nyata untukmu.');
  }
  if (s.offerA.bonusType === 'kinerja' || s.offerB.bonusType === 'kinerja') {
    items.push('Salah satu tawaran punya bonus berbasis kinerja. Angka di perbandingan ini adalah estimasi kalau target tercapai penuh, jumlah sebenarnya bisa lebih rendah.');
  }
  if (s.offerA.thrMultiplier !== s.offerB.thrMultiplier) {
    items.push('THR kedua tawaran beda kelipatannya (' + s.offerA.thrMultiplier + 'x vs ' + s.offerB.thrMultiplier + 'x). Cek lagi kebijakan resminya sebelum memutuskan.');
  }
  var esopA = (s.offerA.esopJumlah || '').trim();
  var esopB = (s.offerB.esopJumlah || '').trim();
  if (esopA || esopB) {
    var likuiditasLabel = { belum: 'belum ada exit, jadi opsi ini mungkin bernilai Rp0 sampai IPO/akuisisi benar-benar terjadi', terbatas: 'ada secondary market terbatas, tapi harga dan likuiditasnya tidak terjamin', ada: 'sudah IPO/diakuisisi, opsi ini kemungkinan bisa dicairkan' };
    if (esopA) items.push(escapeHtml(s.offerA.nama || 'Tawaran A') + ' menawarkan ESOP (' + escapeHtml(esopA) + '). Status likuiditas: ' + likuiditasLabel[s.offerA.esopLikuiditas] + '. Sengaja tidak dihitung ke take-home karena valuasinya spekulatif.');
    if (esopB) items.push(escapeHtml(s.offerB.nama || 'Tawaran B') + ' menawarkan ESOP (' + escapeHtml(esopB) + '). Status likuiditas: ' + likuiditasLabel[s.offerB.esopLikuiditas] + '. Sengaja tidak dihitung ke take-home karena valuasinya spekulatif.');
  }
  return items;
}

// ---------- template ----------
function offerAssumeStyle(active, color) {
  return active
    ? 'background:' + color + ';color:#F4F6F7;border:1px solid ' + color + ';'
    : 'background:#F9FAFA;color:#55636F;border:1px solid #C7CFD3;';
}

function offerPanel(key, label, color, colorSoft, s, mobileActive) {
  var o = s[key];
  var kprefix = key;
  var bonusOptions = [['tetap','Nominal tetap'],['persentase','Persentase gaji tahunan'],['kinerja','Berbasis kinerja (estimasi)']];
  var html = '<div class="offer-panel' + (mobileActive ? ' active-mobile' : '') + '" style="background:#F9FAFA;border:1px solid #C7CFD3;border-radius:4px;overflow:hidden;">';
  html += '<div style="background:' + color + ';color:#F4F6F7;padding:14px 18px;">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;">' +
    '<button data-action="editName:' + kprefix + '" style="background:transparent;border:0;outline:none;color:#F4F6F7;font-family:\'Newsreader\',Georgia,serif;font-size:19px;font-style:italic;font-weight:500;text-align:left;cursor:pointer;padding:0;min-width:0;flex:1;">' + escapeHtml(offerDisplayName(s, kprefix)) + ' <span style="font-family:\'Public Sans\';font-size:12px;opacity:.75;">✎</span></button>' +
    '<span style="font:600 10px/1 \'Public Sans\';letter-spacing:.1em;opacity:.85;white-space:nowrap;">' + label + '</span></div>' +
    '<div style="font:400 10px/1.4 \'Public Sans\';opacity:.7;margin-top:4px;">Ketuk nama untuk isi nama perusahaan, dipakai di perbandingan dan ringkasan</div></div>';

  html += '<div style="padding:16px 18px;display:grid;gap:14px;">';

  html += fieldRow('Gaji pokok bulanan', kprefix + '.gajiPokok', o.gajiPokok, true);
  html += fieldRow('Tunjangan transport', kprefix + '.tunjTransport', o.tunjTransport, true);
  html += fieldRow('Tunjangan makan', kprefix + '.tunjMakan', o.tunjMakan, true);
  html += fieldRow('Tunjangan lain-lain', kprefix + '.tunjLain', o.tunjLain, true);

  html += '<div><label style="font:500 12.5px/1.3 \'Public Sans\';color:#1B2430;display:block;margin-bottom:6px;">Skema bonus tahunan</label>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
  bonusOptions.forEach(function(opt){
    html += '<button data-action="setBonusType:' + kprefix + ':' + opt[0] + '" style="padding:7px 10px;border-radius:3px;cursor:pointer;font:600 10.5px/1 \'Public Sans\';' + offerAssumeStyle(o.bonusType === opt[0], color) + '">' + opt[1] + '</button>';
  });
  html += '</div></div>';

  if (o.bonusType !== 'tetap') {
    html += fieldRowPct('Nilai bonus (% dari gaji+tunjangan setahun)', kprefix + '.bonusValue', o.bonusValue);
  } else {
    html += fieldRow('Nilai bonus (nominal)', kprefix + '.bonusValue', o.bonusValue, true);
  }

  html += '<div><div style="display:flex;justify-content:space-between;align-items:baseline;"><label style="font:500 12.5px/1.3 \'Public Sans\';">Kelipatan THR</label><span style="font:600 13px/1 \'JetBrains Mono\',monospace;">' + o.thrMultiplier + 'x</span></div>' +
    '<input id="f-' + kprefix + '-thr" data-bind="' + kprefix + '.thrMultiplier" type="range" min="0" max="3" step="0.5" value="' + o.thrMultiplier + '"></div>';

  html += '<div><label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;">' +
    '<input id="f-' + kprefix + '-useEsop" data-bind="' + kprefix + '.useEsop" data-parse="checkbox" type="checkbox" ' + (o.useEsop ? 'checked' : '') + ' style="margin:2px 0 0;width:16px;height:16px;accent-color:' + color + ';flex:none;cursor:pointer;">' +
    '<span style="font:500 12.5px/1.35 \'Public Sans\';">Pertimbangkan ESOP/equity untuk tawaran ini<span style="display:block;font:400 11px/1.5 \'Public Sans\';color:#55636F;margin-top:3px;">Meski belum vested, ini penting untuk sebagian orang, jadi bisa dicatat sebagai pertimbangan terpisah dari take-home.</span></span></label>';

  if (o.useEsop) {
    html += '<div style="display:grid;gap:10px;padding:12px;margin-top:10px;background:#F4F6F7;border:1px dashed #C7CFD3;border-radius:4px;">' +
      fieldRow('Estimasi nilai ESOP (perkiraanmu sendiri)', kprefix + '.esopAmount', o.esopAmount, true) +
      '<div style="font:400 10.5px/1.5 \'Public Sans\';color:#8A97A0;margin-top:-4px;">Angka ini murni perkiraanmu, bukan hitungan kami, karena valuasi perusahaan swasta tidak bisa dipastikan.</div>' +
      '<div><label style="font:400 11px/1.3 \'Public Sans\';color:#55636F;display:block;margin-bottom:4px;">Jumlah / persentase opsi</label>' +
      '<input id="f-' + kprefix + '-esopJumlah" data-bind="' + kprefix + '.esopJumlah" data-parse="text" value="' + escapeHtml(o.esopJumlah) + '" placeholder="mis. 0,1% atau 5.000 opsi" style="width:100%;border:0;border-bottom:1.5px dotted #C7CFD3;background:transparent;font:400 13px/1.4 \'Public Sans\';padding:5px 0;outline:none;"></div>' +
      '<div>' + fieldRow('Harga strike (opsional)', kprefix + '.esopStrike', o.esopStrike, true) + '</div>' +
      '<div><label style="font:400 11px/1.3 \'Public Sans\';color:#55636F;display:block;margin-bottom:4px;">Skema vesting</label>' +
      '<input id="f-' + kprefix + '-esopVesting" data-bind="' + kprefix + '.esopVesting" data-parse="text" value="' + escapeHtml(o.esopVesting) + '" placeholder="mis. 4 tahun, cliff 1 tahun" style="width:100%;border:0;border-bottom:1.5px dotted #C7CFD3;background:transparent;font:400 13px/1.4 \'Public Sans\';padding:5px 0;outline:none;"></div>' +
      '<div><label style="font:400 11px/1.3 \'Public Sans\';color:#55636F;display:block;margin-bottom:5px;">Status likuiditas</label>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
      ['belum','terbatas','ada'].map(function(k){
        var lbl = { belum:'Belum ada exit', terbatas:'Secondary terbatas', ada:'Sudah IPO/diakuisisi' }[k];
        return '<button data-action="setEsopLikuiditas:' + kprefix + ':' + k + '" style="padding:6px 9px;border-radius:3px;cursor:pointer;font:600 10px/1 \'Public Sans\';' + offerAssumeStyle(o.esopLikuiditas === k, color) + '">' + lbl + '</button>';
      }).join('') +
      '</div></div>' +
      '</div>';
  }
  html += '</div>';

  html += '<div><label style="font:500 12.5px/1.3 \'Public Sans\';color:#1B2430;display:block;margin-bottom:6px;">Catatan lain (opsional, tidak dihitung)</label>' +
    '<input id="f-' + kprefix + '-lain" data-bind="' + kprefix + '.catatanLain" data-parse="text" value="' + escapeHtml(o.catatanLain) + '" placeholder="mis. remote 3 hari, jenjang karir jelas" style="width:100%;border:0;border-bottom:1.5px dotted #C7CFD3;background:transparent;font:400 13px/1.4 \'Public Sans\';padding:6px 0;outline:none;"></div>';

  html += '</div></div>';
  return html;
}

function fieldRow(label, bind, val, isDigits) {
  var id = 'f-' + bind.replace('.', '-');
  return '<div><label style="font:500 12.5px/1.3 \'Public Sans\';color:#1B2430;display:block;margin-bottom:6px;">' + label + '</label>' +
    '<div style="display:flex;align-items:center;gap:6px;border-bottom:1.5px solid #1B2430;padding-bottom:5px;">' +
    '<span style="font:500 12px/1 \'JetBrains Mono\',monospace;color:#55636F;">Rp</span>' +
    '<input id="' + id + '" data-bind="' + bind + '" data-parse="digits" inputmode="numeric" value="' + full(val) + '" style="flex:1;border:0;outline:none;background:transparent;font:600 16px/1.2 \'JetBrains Mono\',monospace;color:#1B2430;min-width:0;"></div></div>';
}
function fieldRowPct(label, bind, val) {
  var id = 'f-' + bind.replace('.', '-');
  return '<div><label style="font:500 12.5px/1.3 \'Public Sans\';color:#1B2430;display:block;margin-bottom:6px;">' + label + '</label>' +
    '<div style="display:flex;align-items:center;gap:6px;border-bottom:1.5px solid #1B2430;padding-bottom:5px;">' +
    '<input id="' + id + '" data-bind="' + bind + '" inputmode="decimal" value="' + val + '" style="flex:1;border:0;outline:none;background:transparent;font:600 16px/1.2 \'JetBrains Mono\',monospace;color:#1B2430;min-width:0;">' +
    '<span style="font:500 12px/1 \'JetBrains Mono\',monospace;color:#55636F;">%</span></div></div>';
}

function template() {
  var s = state;
  var cA = computeOffer(s.offerA, s);
  var cB = computeOffer(s.offerB, s);
  var callouts = buildCallouts(s, cA, cB);
  var diff = cA.takeHomeAnnual - cB.takeHomeAnnual;
  var leaderKey = diff === 0 ? null : (diff > 0 ? 'offerA' : 'offerB');
  var leaderName = leaderKey ? offerDisplayName(s, leaderKey) : null;
  var leaderColor = leaderKey === 'offerA' ? '#2456A6' : '#B8802C';
  var maxTakeHome = Math.max(cA.takeHomeAnnual, cB.takeHomeAnnual, 1);
  var barA = Math.max(4, cA.takeHomeAnnual / maxTakeHome * 100);
  var barB = Math.max(4, cB.takeHomeAnnual / maxTakeHome * 100);

  var html = '<div style="max-width:880px;margin:0 auto;background:#F4F6F7;min-height:100vh;padding-bottom:72px;box-shadow:0 0 0 1px #C7CFD3;">';

  // header
  html += '<div style="padding:24px 20px 18px;border-bottom:1px solid #C7CFD3;">' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
    '<div style="font:600 10px/1 \'Public Sans\';letter-spacing:.16em;text-transform:uppercase;color:#55636F;">Perencana Karier</div>' +
    '<button data-action="toggleHelp" style="width:18px;height:18px;border-radius:50%;border:1px solid #55636F;background:transparent;color:#55636F;font:600 10px/1 \'JetBrains Mono\',monospace;cursor:pointer;padding:0;line-height:16px;">?</button></div>' +
    '<div style="font-family:\'Newsreader\',Georgia,serif;font-size:28px;line-height:1.15;margin-top:8px;letter-spacing:-.01em;">Dua tawaran kerja, <em style="font-style:italic;">satu keputusan.</em></div>' +
    '<div style="font:400 13px/1.6 \'Public Sans\';color:#55636F;margin-top:8px;max-width:56ch;">Bandingkan take-home riil, bukan cuma gaji pokok, sudah dipotong PPh 21 dan BPJS.</div>' +
    (ownerName ? '<div style="font:400 10.5px/1 \'JetBrains Mono\',monospace;color:#8A97A0;margin-top:10px;">MILIK ' + escapeHtml(ownerName).toUpperCase() + '</div>' : '') +
    '</div>';

  // shared assumptions
  html += '<div style="padding:16px 20px 18px;background:#EDF0F1;border-bottom:1px solid #C7CFD3;">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;">' +
    '<div style="font:600 10px/1 \'Public Sans\';letter-spacing:.14em;text-transform:uppercase;color:#55636F;">Asumsi Pajak &amp; BPJS</div>' +
    '<button data-action="toggleAsumsi" style="border:1px solid #C7CFD3;background:#F9FAFA;color:#1B2430;font:600 10px/1 \'Public Sans\';letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border-radius:999px;cursor:pointer;">' + (s.showAsumsi ? 'Tutup' : 'Ubah') + '</button></div>';

  if (s.showAsumsi) {
    html += '<div style="display:grid;gap:14px;margin-top:14px;">' +
      '<div><label style="font:500 12.5px/1.3 \'Public Sans\';color:#1B2430;display:block;margin-bottom:6px;">Status PTKP (sama untuk kedua tawaran, ini tentang kamu, bukan perusahaan)</label>' +
      '<select data-bind="ptkpStatus" data-parse="text" style="width:100%;max-width:340px;border:0;border-bottom:1.5px solid #1B2430;background:transparent;font:500 14px/1.4 \'Public Sans\';padding:8px 0;outline:none;color:#1B2430;">' +
      Object.keys(PTKP_LABEL).map(function(key){
        return '<option value="' + key + '"' + (s.ptkpStatus === key ? ' selected' : '') + '>' + PTKP_LABEL[key] + '</option>';
      }).join('') +
      '</select></div>' +
      '<div><div style="display:flex;justify-content:space-between;align-items:baseline;"><label style="font:500 12.5px/1.3 \'Public Sans\';">Tarif JKK (risiko kerja, ditanggung perusahaan)</label><span style="font:600 13px/1 \'JetBrains Mono\',monospace;">' + pct(s.jkkRate, 2) + '</span></div>' +
      '<input id="f-jkkRate" data-bind="jkkRate" type="range" min="0.24" max="1.74" step="0.05" value="' + s.jkkRate + '">' +
      '<div style="font:400 11px/1.5 \'Public Sans\';color:#55636F;">0,24% untuk risiko rendah (kantoran) sampai 1,74% untuk risiko tinggi. Tanya HR kalau tidak yakin.</div></div>' +
      '<div><label style="font:500 12.5px/1.3 \'Public Sans\';color:#1B2430;display:block;margin-bottom:6px;">Batas upah Jaminan Pensiun (JP)</label>' +
      '<div style="font:600 15px/1.2 \'JetBrains Mono\',monospace;color:#1B2430;">' + rp(JP_CAP) + '</div>' +
      '<div style="font:400 11px/1.5 \'Public Sans\';color:#55636F;margin-top:6px;">Batas ini sama untuk semua orang, ditetapkan BPJS Ketenagakerjaan, bukan oleh perusahaan. Gaji di atas angka ini tetap dihitung JP-nya hanya sampai batas ini. Berlaku sejak Maret 2026 (SE BPJS Ketenagakerjaan No. B/1226/022026), naik tiap tahun sekitar Februari/Maret.</div></div>' +
      '<div style="font:400 11px/1.6 \'Public Sans\';color:#8A97A0;padding-top:10px;border-top:1px dashed #C7CFD3;">Tarif PPh 21 memakai skema progresif Pasal 17 tahunan (5% sampai 35%). BPJS Kesehatan 5% (batas Rp12 juta), JHT 5,7%, JP 3%, JKM 0,3%. Sumber: aturan berlaku per pertengahan 2026, bisa berubah.</div>' +
      '</div>';
  }
  html += '</div>';

  // mobile tab nav
  html += '<div class="tab-nav-offers" style="padding:10px 20px 0;gap:6px;">' +

    offerPanel('offerB', 'TAWARAN B', '#B8802C', '#F7EFE0', s, s.tab === 1) +
    '</div>';

  // comparison / verdict
  html += '<div style="margin:22px 20px 0;background:#1B2430;color:#F4F6F7;border-radius:4px;padding:22px 20px;">' +
    '<div style="font:600 10px/1 \'Public Sans\';letter-spacing:.16em;text-transform:uppercase;color:#8A97A0;">Take-home tahunan riil</div>';

  [['offerA', cA, '#5B8FE0', barA], ['offerB', cB, '#E0AC5B', barB]].forEach(function(row){

      '<span style="font-family:\'JetBrains Mono\',monospace;font-weight:600;font-size:16px;white-space:nowrap;">' + rp(c.takeHomeAnnual) + '</span></div>' +
      '<div style="height:8px;background:#2E3947;border-radius:999px;overflow:hidden;margin-top:8px;"><div style="width:' + barW.toFixed(1) + '%;height:100%;background:' + barColor + ';"></div></div>' +
      '<div style="font:400 11px/1.5 \'Public Sans\';color:#8A97A0;margin-top:5px;">≈ ' + rp(c.takeHomeMonthlyAvg) + ' / bulan (THR &amp; bonus diratakan)</div></div>';
  });

  html += '<div style="height:1px;background:#2E3947;margin:16px 0;"></div>' +
    '<div style="display:flex;justify-content:space-between;gap:10px;font:500 12.5px/1.4 \'Public Sans\';">' +
    '<span style="color:#8A97A0;">Selisih take-home tahunan</span>' +
    '<span style="font-family:\'JetBrains Mono\',monospace;">' + rp(Math.abs(diff)) + (leaderName ? ' (' + escapeHtml(leaderName) + ' lebih tinggi)' : ' (sama)') + '</span></div>' +
    '</div>';

  // callouts
  if (callouts.length) {
    html += '<div style="margin:14px 20px 0;background:#F2EADB;border:1px solid #C7CFD3;border-radius:4px;padding:16px 18px;">' +
      '<div style="font:600 10px/1 \'Public Sans\';letter-spacing:.14em;text-transform:uppercase;color:#55636F;margin-bottom:10px;">Hal yang perlu diperhatikan</div>';
    callouts.forEach(function(c, idx){
      html += '<div style="' + (idx > 0 ? 'margin-top:10px;padding-top:10px;border-top:1px solid #DED5C4;' : '') + 'font:400 12.5px/1.6 \'Public Sans\';color:#4A443C;">' + c + '</div>';
    });
    html += '</div>';
  }

  // breakdown table
  html += '<div style="margin:14px 20px 0;background:#F9FAFA;border:1px solid #C7CFD3;border-radius:4px;padding:18px 20px;">' +
    '<div style="font:600 10px/1 \'Public Sans\';letter-spacing:.14em;text-transform:uppercase;color:#55636F;margin-bottom:12px;">Rincian tahunan</div>';
  var breakdownRows = [
    ['Gaji + tunjangan tetap', cA.annualFixed, cB.annualFixed],
    ['THR', cA.thrAmt, cB.thrAmt],
    ['Bonus (estimasi)', cA.bonusAmt, cB.bonusAmt],
    ['Total gross', cA.grossAnnual, cB.grossAnnual],
    ['Potongan BPJS (bagian karyawan)', -cA.empBpjsAnnual, -cB.empBpjsAnnual],
    ['PPh 21', -cA.pph21Annual, -cB.pph21Annual],
    ['Total nett', cA.takeHomeAnnual, cB.takeHomeAnnual],

  if (s.offerA.useEsop || s.offerB.useEsop) {
    breakdownRows.push([
      'ESOP (estimasimu, belum tentu bisa dicairkan)',
      s.offerA.useEsop ? s.offerA.esopAmount : 0,
      s.offerB.useEsop ? s.offerB.esopAmount : 0
    ]);
  }
  breakdownRows.forEach(function(row, idx){
    var isBold = row[0] === 'Total gross' || row[0] === 'Total nett';
    html += '<div style="display:grid;grid-template-columns:1fr 0.95fr 0.95fr;gap:6px;padding:8px 0;min-width:0;' + (idx > 0 ? 'border-top:1px dashed #C7CFD3;' : '') + '">' +
      '<span style="font:' + (isBold ? '600' : '400') + ' 12px/1.4 \'Public Sans\';color:' + (isBold ? '#1B2430' : '#55636F') + ';min-width:0;">' + row[0] + '</span>' +

      '<span style="font:' + (isBold ? '600' : '500') + ' 11px/1.3 \'JetBrains Mono\',monospace;text-align:right;white-space:nowrap;min-width:0;">' + rp(row[2]) + '</span></div>';
  });

  // download/share, outside any card
  html += '<div style="margin:16px 20px 0;display:flex;justify-content:center;gap:10px;">' +
    '<button data-action="downloadSummary" title="Unduh ringkasan" aria-label="Unduh ringkasan" style="width:38px;height:38px;border-radius:50%;border:1px solid #C7CFD3;background:#F9FAFA;color:#1B2430;display:flex;align-items:center;justify-content:center;cursor:pointer;">' + ICON_DOWNLOAD + '</button>' +
    '<button data-action="shareSummary" title="Bagikan ringkasan" aria-label="Bagikan ringkasan" style="width:38px;height:38px;border-radius:50%;border:1px solid #C7CFD3;background:#F9FAFA;color:#1B2430;display:flex;align-items:center;justify-content:center;cursor:pointer;">' + ICON_SHARE + '</button>' +

  // footer credit
  html += '<div style="margin:24px 20px 0;padding-top:14px;border-top:1px solid #C7CFD3;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">' +

    (ownerName ? '<span style="font:400 10px/1.4 \'JetBrains Mono\',monospace;color:#8A97A0;letter-spacing:.03em;">Salinan pribadi: ' + escapeHtml(ownerName) + '</span>' : '') +
    '</div>';

  html += '<div style="margin:10px 20px 0;font:400 11px/1.6 \'Public Sans\';color:#8A97A0;">Alat ini memberi estimasi berdasarkan asumsi yang bisa kamu ubah sendiri, bukan nasihat pajak resmi. Tidak ada data yang dikirim ke mana pun, semua perhitungan terjadi di perangkatmu.</div>';

  html += '</div>';
  return html;
}

// ---------- render + event delegation ----------
var root = document.getElementById('app');

function render() {
  var active = document.activeElement;
  var activeId = active && active.id;
  var selStart = null, selEnd = null;
  if (active && 'selectionStart' in active) { selStart = active.selectionStart; selEnd = active.selectionEnd; }

  root.innerHTML = template();

  if (activeId) {
    var el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

root.addEventListener('input', function(e){
  var el = e.target;
  var bind = el.dataset.bind;
  if (!bind) return;
  if (el.type === 'range') return; // committed on release, not mid-drag
  var val;
  if (el.dataset.parse === 'checkbox') val = el.checked;
  else if (el.dataset.parse === 'digits') val = Number(String(el.value).replace(/\D/g, '')) || 0;
  else if (el.dataset.parse === 'text') val = el.value;
  else if (el.inputMode === 'decimal') val = Number(String(el.value).replace(/[^0-9.]/g, '')) || 0;
  else val = Number(el.value);
  var patch = {}; patch[bind] = val;
  setState(patch);
});

function commitRange(el) {
  var bind = el.dataset.bind;
  if (!bind || el.type !== 'range') return;
  var val = Number(el.value);
  if (getNested(state, bind) === val) return;
  var patch = {}; patch[bind] = val;
  setState(patch);
}
root.addEventListener('change', function(e){ commitRange(e.target); });
root.addEventListener('pointerup', function(e){ if (e.target.type === 'range') commitRange(e.target); });
root.addEventListener('touchend', function(e){ if (e.target.type === 'range') commitRange(e.target); });
root.addEventListener('mouseup', function(e){ if (e.target.type === 'range') commitRange(e.target); });

root.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.dataset.action;
  if (action.indexOf('go:') === 0) setState({ tab: Number(action.split(':')[1]) });
  else if (action === 'toggleAsumsi') setState({ showAsumsi: !state.showAsumsi });
  else if (action === 'toggleHelp') { helpOpen ? hideHelp() : showHelpPanel(); }
  else if (action === 'downloadSummary') downloadSummaryImage();
  else if (action === 'shareSummary') shareSummaryImage();
  else if (action.indexOf('editName:') === 0) showNameModal(action.split(':')[1]);
  else if (action.indexOf('setEsopLikuiditas:') === 0) {
    var esopParts = action.split(':');
    var esopPatch = {}; esopPatch[esopParts[1] + '.esopLikuiditas'] = esopParts[2];
    setState(esopPatch);
  }
  else if (action.indexOf('setBonusType:') === 0) {
    var parts = action.split(':');
    var patch = {}; patch[parts[1] + '.bonusType'] = parts[2];
    setState(patch);
  }
});

render();

// ---------- access gate + ownership watermark (local only, nothing sent anywhere) ----------
function fnv32(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
    h >>>= 0;
  }
  return h;
}
function validateCode(input) {
  var clean = input.trim().toUpperCase().replace(/-/g, '');
  if (clean.length !== 8) return false;
  var id = clean.slice(0, 4);
  var check = clean.slice(4, 8);
  var expected = fnv32(SECRET + id).toString(36).toUpperCase().padStart(4, '0').slice(-4);
  return expected === check;
}

function submitGate() {
  var codeInput = document.getElementById('gate-code');
  var nameInput = document.getElementById('gate-input');
  var errorEl = document.getElementById('gate-error');
  var code = codeInput.value.trim();
  var name = nameInput.value.trim();

    errorEl.textContent = 'Kode akses salah. Cek kembali email pembelianmu (format: XXXX-XXXX).';
    codeInput.focus();
    return;
  }
  if (!name) {
    errorEl.textContent = '';
    nameInput.focus();
    return;
  }
  ownerName = name;
  try {
    localStorage.setItem(OWNER_KEY, name);
    localStorage.setItem(ACCESS_KEY, '1');
  } catch (e) {}
  document.getElementById('gate').innerHTML = '';
  render();
}

// ---------- summary image (canvas, native APIs only, no external libraries) ----------
function wrapLines(ctx, text, maxWidth) {
  var words = text.split(' ');
  var lines = [];
  var current = '';
  for (var i = 0; i < words.length; i++) {
    var test = current ? current + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = words[i];
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}
function truncateText(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  var out = text;
  while (out.length > 1 && ctx.measureText(out + '\u2026').width > maxWidth) {
    out = out.slice(0, -1);
  }
  return out + '\u2026';
}
function stripHtml(str) {
  return String(str).replace(/<[^>]*>/g, '');
}

function buildSummaryCanvas() {
  var s = state;
  var cA = computeOffer(s.offerA, s);
  var cB = computeOffer(s.offerB, s);
  var callouts = buildCallouts(s, cA, cB);
  var diff = cA.takeHomeAnnual - cB.takeHomeAnnual;
  var leaderKey = diff === 0 ? null : (diff > 0 ? 'offerA' : 'offerB');
  var leaderName = leaderKey ? offerDisplayName(s, leaderKey) : null;

  var breakdownRows = [
    ['Gaji + tunjangan tetap', cA.annualFixed, cB.annualFixed, false],
    ['THR', cA.thrAmt, cB.thrAmt, false],
    ['Bonus (estimasi)', cA.bonusAmt, cB.bonusAmt, false],
    ['Total gross', cA.grossAnnual, cB.grossAnnual, true],
    ['Potongan BPJS (bagian karyawan)', -cA.empBpjsAnnual, -cB.empBpjsAnnual, false],
    ['PPh 21', -cA.pph21Annual, -cB.pph21Annual, false],
    ['Total nett', cA.takeHomeAnnual, cB.takeHomeAnnual, true],
    ['Nilai BPJS ditanggung perusahaan', cA.employerBenefitAnnual, cB.employerBenefitAnnual, false]
  ];
  if (s.offerA.useEsop || s.offerB.useEsop) {
    breakdownRows.push([
      'ESOP (estimasimu, belum tentu bisa dicairkan)',
      s.offerA.useEsop ? s.offerA.esopAmount : 0,
      s.offerB.useEsop ? s.offerB.esopAmount : 0,
      false
    ]);
  }

  var W = 1080;
  var margin = 60;
  var contentW = W - margin * 2;

  // measuring context to compute wrapped callout heights before knowing final canvas height
  var meas = document.createElement('canvas').getContext('2d');
  meas.font = '400 26px Arial, sans-serif';
  var calloutLineGroups = callouts.map(function(c){ return wrapLines(meas, stripHtml(c), contentW - 40); });

  // ---- layout heights ----
  var headerH = 800;
  var calloutsH = 0;
  if (callouts.length) {
    calloutsH = 70; // top padding + label
    calloutLineGroups.forEach(function(lines, idx){
      calloutsH += lines.length * 34;
      calloutsH += idx < calloutLineGroups.length - 1 ? 28 : 40; // gap between callouts / bottom padding
    });
  }
  var rowH = 58;
  var breakdownH = 60 + breakdownRows.length * rowH + 20;
  var gap = 20;
  var footerH = 80;
  var H = headerH + (callouts.length ? gap + calloutsH : 0) + gap + breakdownH + footerH;

  var canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');
  ctx.textBaseline = 'top';

  ctx.fillStyle = '#E4E8EA';
  ctx.fillRect(0, 0, W, H);

  var y = 0;

  // ---- header / verdict (dark) ----
  ctx.fillStyle = '#1B2430';
  ctx.fillRect(0, y, W, headerH);

  ctx.fillStyle = '#8A97A0';
  ctx.font = '600 24px Arial, sans-serif';
  ctx.fillText('TAKE-HOME TAHUNAN RIIL', margin, y + 50);

  function offerBlock(by, key, color) {
    var c = key === 'offerA' ? cA : cB;
    var name = offerDisplayName(s, key);
    ctx.font = '600 32px Georgia, serif';
    var nameMaxW = contentW - 280;
    var displayName = truncateText(ctx, name, nameMaxW);
    ctx.fillStyle = color;
    ctx.fillRect(margin, by, 10, 130);
    ctx.fillStyle = '#F4F6F7';
    ctx.fillText(displayName, margin + 30, by);
    if (leaderKey === key) {
      var badgeX = margin + 30 + ctx.measureText(displayName).width + 16;
      ctx.strokeStyle = '#7FD9A8';
      ctx.lineWidth = 1.5;
      var badgeW = 110, badgeH = 34;
      roundRect(ctx, badgeX, by - 2, badgeW, badgeH, 17);
      ctx.stroke();
      ctx.fillStyle = '#7FD9A8';
      ctx.font = '700 16px Arial, sans-serif';
      ctx.fillText('UNGGUL', badgeX + 16, by + 9);
    }
    ctx.fillStyle = color;
    ctx.font = '700 54px Arial, sans-serif';
    ctx.fillText(rp(c.takeHomeAnnual), margin + 30, by + 46);
    ctx.fillStyle = '#8A97A0';
    ctx.font = '400 24px Arial, sans-serif';
    ctx.fillText('kira-kira ' + rp(c.takeHomeMonthlyAvg) + ' / bulan', margin + 30, by + 106);
  }

  offerBlock(y + 90, 'offerA', '#5B8FE0');
  offerBlock(y + 300, 'offerB', '#E0AC5B');

  ctx.strokeStyle = '#2E3947';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(margin, y + 500); ctx.lineTo(W - margin, y + 500); ctx.stroke();

  ctx.fillStyle = '#8A97A0';
  ctx.font = '500 24px Arial, sans-serif';
  ctx.fillText('Selisih take-home tahunan', margin, y + 530);
  ctx.fillStyle = '#F4F6F7';
  ctx.font = '700 40px Arial, sans-serif';
  var diffText = rp(Math.abs(diff)) + (leaderName ? '  (' + leaderName + ' lebih tinggi)' : '');
  ctx.fillText(truncateText(ctx, diffText, contentW), margin, y + 566);

  y += headerH;

  // ---- callouts (cream) ----
  if (callouts.length) {
    y += gap;
    ctx.fillStyle = '#F2EADB';
    ctx.fillRect(0, y, W, calloutsH);
    ctx.strokeStyle = '#C7CFD3';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, y + 0.5, W - 1, calloutsH - 1);

    var cy = y + 34;
    ctx.fillStyle = '#55636F';
    ctx.font = '600 20px Arial, sans-serif';
    ctx.fillText('HAL YANG PERLU DIPERHATIKAN', margin, cy);
    cy += 46;

    ctx.font = '400 26px Arial, sans-serif';
    calloutLineGroups.forEach(function(lines, idx){
      if (idx > 0) {
        ctx.strokeStyle = '#DED5C4';
        ctx.beginPath(); ctx.moveTo(margin, cy - 14); ctx.lineTo(W - margin, cy - 14); ctx.stroke();
      }
      ctx.fillStyle = '#4A443C';
      lines.forEach(function(line){
        ctx.fillText(line, margin, cy);
        cy += 34;
      });
      cy += idx < calloutLineGroups.length - 1 ? 14 : 0;
    });

    y += calloutsH;
  }

  // ---- breakdown table (white) ----
  y += gap;
  ctx.fillStyle = '#F9FAFA';
  ctx.fillRect(0, y, W, breakdownH);
  ctx.strokeStyle = '#C7CFD3';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, y + 0.5, W - 1, breakdownH - 1);

  var by2 = y + 40;
  ctx.fillStyle = '#55636F';
  ctx.font = '600 20px Arial, sans-serif';
  ctx.fillText('RINCIAN TAHUNAN', margin, by2);
  by2 += 44;

  var col2Right = margin + contentW * 0.68;
  var col3Right = W - margin;

  breakdownRows.forEach(function(row, idx){
    if (idx > 0) {
      ctx.strokeStyle = '#DED5C4';
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(margin, by2 - 14); ctx.lineTo(W - margin, by2 - 14); ctx.stroke();
      ctx.setLineDash([]);
    }
    var isBold = row[3];
    ctx.font = (isBold ? '600' : '400') + ' 24px Arial, sans-serif';
    ctx.fillStyle = isBold ? '#1B2430' : '#55636F';
    ctx.fillText(truncateText(ctx, row[0], col2Right - margin - 220), margin, by2);

    ctx.font = (isBold ? '700' : '500') + ' 23px Arial, sans-serif';
    ctx.fillStyle = isBold ? '#1B2430' : '#333F49';
    var v1 = rp(row[1]);
    ctx.fillText(v1, col2Right - ctx.measureText(v1).width, by2);
    var v2 = rp(row[2]);
    ctx.fillText(v2, col3Right - ctx.measureText(v2).width, by2);

    by2 += rowH;
  });

  y += breakdownH;

  // ---- footer ----
  y += gap;
  ctx.fillStyle = '#55636F';
  ctx.font = '400 20px Arial, sans-serif';
  ctx.fillText(BRAND + ', dibuat oleh ' + CREATOR, margin, y + 24);

  return canvas;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function downloadSummaryImage() {
  var canvas = buildSummaryCanvas();
  canvas.toBlob(function(blob){
    if (!blob) return;
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'perbandingan-tawaran-kerja.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }, 'image/png');
}

function showToast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B2430;color:#F4F6F7;padding:12px 18px;border-radius:6px;font:500 12.5px/1.4 \'Public Sans\',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:200;max-width:80vw;text-align:center;';
  document.body.appendChild(t);
  setTimeout(function(){
    t.style.transition = 'opacity .3s';
    t.style.opacity = '0';
    setTimeout(function(){ t.remove(); }, 300);
  }, 2600);
}

function shareSummaryImage() {
  var canvas = buildSummaryCanvas();
  canvas.toBlob(function(blob){
    if (!blob) return;
    var file;
    try { file = new File([blob], 'perbandingan-tawaran-kerja.png', { type: 'image/png' }); } catch (e) {}

    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: BRAND }).catch(function(){});
      return;
    }
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        var item = new ClipboardItem({ 'image/png': blob });
        navigator.clipboard.write([item]).then(function(){
          showToast('Gambar disalin, tempel (paste) di WhatsApp, email, atau chat lain.');
        }).catch(function(){
          downloadSummaryImage();
          showToast('Berbagi langsung tidak didukung di browser ini, gambar diunduh sebagai gantinya.');
        });
        return;
      } catch (e) {}
    }
    downloadSummaryImage();
    showToast('Berbagi langsung tidak didukung di browser ini, gambar diunduh sebagai gantinya.');
  }, 'image/png');
}

    '<div style="background:#F4F6F7;border:1px solid #1B2430;max-width:320px;width:100%;padding:24px 22px;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.35);">' +

    '<div style="display:flex;gap:8px;">' +
    '<button id="nameModal-cancel" style="flex:1;border:1px solid #C7CFD3;background:#F9FAFA;color:#55636F;padding:11px;font:600 11px/1 \'Public Sans\';letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:3px;">Batal</button>' +
    '<button id="nameModal-save" style="flex:1;background:' + color + ';color:#F4F6F7;border:none;padding:11px;font:600 11px/1 \'Public Sans\';letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:3px;">Simpan</button>' +
    '</div></div></div>';

  var input = document.getElementById('nameModal-input');
  document.getElementById('nameModal-save').addEventListener('click', function(){ submitNameModal(key); });
  document.getElementById('nameModal-cancel').addEventListener('click', hideNameModal);
  document.getElementById('nameModal-backdrop').addEventListener('click', function(e){ if (e.target.id === 'nameModal-backdrop') hideNameModal(); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submitNameModal(key); if (e.key === 'Escape') hideNameModal(); });
  input.focus();
  input.select();
}
function submitNameModal(key) {
  var input = document.getElementById('nameModal-input');
  var patch = {}; patch[key + '.nama'] = input.value.trim();
  setState(patch);
  hideNameModal();
}
function hideNameModal() {
  document.getElementById('nameModal').innerHTML = '';
}
})();
